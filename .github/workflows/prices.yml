name: Update prices and publish

on:
  schedule:
    # Every 12 hours (UTC). GitHub runs scheduled jobs on a best-effort basis,
    # so expect drift of a few minutes under load.
    - cron: '0 */12 * * *'
  workflow_dispatch: # the manual "refresh" — replaces the button in static mode
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/prices.yml'

# Allow committing the refreshed history and publishing to Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs fight over the history file or the Pages deployment.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm test

      # Rebuild the database from the record committed in the repo — price
      # history and the alternatives snapshot both. On the very first run there
      # is none, and the app backfills sample data instead.
      #
      # This has to precede the refresh below: without it the alternatives table
      # starts empty, every part looks stale, and the weekly cadence turns into
      # a search for all nine parts twice a day.
      - name: Restore tracked data
        run: npm run history:import

      - name: Fetch current prices
        env:
          # Optional — set these as repository secrets to use real price sources.
          # Absent, the workflow publishes sample data and says so in the UI.
          CANOPY_API_KEY: ${{ secrets.CANOPY_API_KEY }}
          PAAPI_ACCESS_KEY: ${{ secrets.PAAPI_ACCESS_KEY }}
          PAAPI_SECRET_KEY: ${{ secrets.PAAPI_SECRET_KEY }}
          PAAPI_PARTNER_TAG: ${{ secrets.PAAPI_PARTNER_TAG }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: npm run fetch

      # Discovery, not tracking: refreshAlternatives() only calls the API for
      # parts whose suggestions are older than alternatives.refreshDays, so this
      # runs every 12h but spends about one request per part per week.
      - name: Refresh part alternatives
        env:
          CANOPY_API_KEY: ${{ secrets.CANOPY_API_KEY }}
        run: npm run alternatives

      - name: Save tracked data
        run: npm run history:export

      - name: Build static site
        run: npm run site

      - name: Commit updated record
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/price-history.ndjson history/alternatives.ndjson
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: update tracked data [skip ci]"
            git push
          fi

      # Requires a ONE-TIME manual step that cannot be automated from here:
      #   Settings → Pages → Build and deployment → Source: "GitHub Actions"
      # `enablement: true` looks like it would do this, but the default
      # GITHUB_TOKEN may deploy to Pages and not create the site, so it fails
      # with "Create Pages site failed: Resource not accessible by integration".
      # The dropdown only appears once the repository is public (or on a paid
      # plan) — on a private free repo the settings page shows an upgrade
      # prompt with no Source selector at all.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
